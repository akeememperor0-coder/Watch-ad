<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fep Web Solutions — Admin</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0B1220; color:#F1F5FB; margin:0; padding:20px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size:1.3rem; }
  .tabs { display:flex; gap:8px; margin: 16px 0; }
  .tab { padding:8px 14px; border-radius:999px; border:1px solid #2a3b5c; background:transparent; color:#93A2BE; cursor:pointer; }
  .tab.active { background:#F1F5FB; color:#0B1220; }
  .panel { display:none; }
  .panel.active { display:block; }
  input, textarea, select { width:100%; padding:10px 12px; margin-bottom:10px; border-radius:8px; border:1px solid #2a3b5c; background:#121C31; color:#F1F5FB; box-sizing:border-box; }
  button.action { padding:10px 16px; border-radius:8px; border:none; background:#3DA9FC; color:#06121F; font-weight:600; cursor:pointer; }
  .card { border:1px solid #2a3b5c; border-radius:10px; padding:14px; margin-bottom:10px; background:#121C31; }
  .card h3 { margin:0 0 6px; font-size:1rem; }
  .card p { margin:0 0 6px; color:#93A2BE; font-size:0.9rem; }
  .card .row { display:flex; gap:8px; margin-top:8px; }
  .card button { padding:6px 12px; border-radius:6px; border:1px solid #2a3b5c; background:transparent; color:#F1F5FB; cursor:pointer; font-size:0.8rem; }
  #loginGate { max-width:320px; margin: 80px auto; text-align:center; }
  .msg-meta { font-size:0.75rem; color:#93A2BE; }
</style>
</head>
<body>

<div id="loginGate">
  <h1>Admin login</h1>
  <input type="password" id="passwordInput" placeholder="Admin password">
  <button class="action" id="loginBtn" style="width:100%;">Enter</button>
  <p id="loginError" style="color:#FF6B6B; font-size:0.85rem;"></p>
</div>

<div class="wrap" id="dashboard" style="display:none;">
  <h1>Fep Web Solutions — Admin</h1>
  <div class="tabs">
    <button class="tab active" data-tab="projects">Projects</button>
    <button class="tab" data-tab="messages">Messages</button>
  </div>

  <div class="panel active" id="panel-projects">
    <h3>Add a project</h3>
    <input type="text" id="pTitle" placeholder="Project name">
    <input type="text" id="pCategory" placeholder="Category (e.g. E-commerce)">
    <textarea id="pDescription" placeholder="One-line description"></textarea>
    <select id="pStatus">
      <option value="live">Live site</option>
      <option value="progress">In progress</option>
    </select>
    <input type="text" id="pColor" placeholder="Accent hex color (optional, e.g. #2C4066)">
    <input type="number" id="pPrice" placeholder="Price in USD (e.g. 150)" min="0" step="1">
    <button class="action" id="addProjectBtn">Add project</button>

    <h3 style="margin-top:28px;">Existing projects</h3>
    <div id="projectList">Loading…</div>
  </div>

  <div class="panel" id="panel-messages">
    <h3>Messages & leads</h3>
    <div id="messageList">Loading…</div>
  </div>
</div>

<script>
  var ADMIN_PASSWORD_KEY = 'fep_admin_password';

  function getPassword(){ return sessionStorage.getItem(ADMIN_PASSWORD_KEY); }

  function authHeaders(){
    return { 'Content-Type': 'application/json', 'x-admin-password': getPassword() };
  }

  document.getElementById('loginBtn').addEventListener('click', function(){
    var pw = document.getElementById('passwordInput').value;
    sessionStorage.setItem(ADMIN_PASSWORD_KEY, pw);
    checkLogin();
  });

  function checkLogin(){
    fetch('/api/messages', { headers: authHeaders() })
      .then(function(r){
        if (r.status === 401) {
          document.getElementById('loginError').textContent = 'Wrong password.';
          return;
        }
        document.getElementById('loginGate').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadProjects();
        r.json().then(renderMessages);
      })
      .catch(function(){ document.getElementById('loginError').textContent = 'Could not reach the backend.'; });
  }

  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
      document.getElementById('panel-' + t.dataset.tab).classList.add('active');
    });
  });

  function loadProjects(){
    fetch('/api/projects').then(function(r){ return r.json(); }).then(function(list){
      var el = document.getElementById('projectList');
      if (!list.length) { el.innerHTML = '<p>No projects yet.</p>'; return; }
      el.innerHTML = list.map(function(p){
        return '<div class="card">' +
          '<h3>' + p.title + ' <span style="font-weight:400;color:#93A2BE;">(' + p.status + (p.price ? ', $' + p.price : '') + ')</span></h3>' +
          '<p>' + p.category + ' — ' + p.description + '</p>' +
          '<div class="row"><button data-id="' + p.id + '" class="delete-project">Delete</button></div>' +
        '</div>';
      }).join('');
      document.querySelectorAll('.delete-project').forEach(function(btn){
        btn.addEventListener('click', function(){
          fetch('/api/projects', { method: 'DELETE', headers: authHeaders(), body: JSON.stringify({ id: btn.dataset.id }) })
            .then(loadProjects);
        });
      });
    });
  }

  document.getElementById('addProjectBtn').addEventListener('click', function(){
    var project = {
      title: document.getElementById('pTitle').value,
      category: document.getElementById('pCategory').value,
      description: document.getElementById('pDescription').value,
      status: document.getElementById('pStatus').value,
      color: document.getElementById('pColor').value || undefined,
      price: document.getElementById('pPrice').value || undefined
    };
    fetch('/api/projects', { method: 'POST', headers: authHeaders(), body: JSON.stringify(project) })
      .then(function(){
        document.getElementById('pTitle').value = '';
        document.getElementById('pCategory').value = '';
        document.getElementById('pDescription').value = '';
        document.getElementById('pColor').value = '';
        document.getElementById('pPrice').value = '';
        loadProjects();
      });
  });

  function renderMessages(list){
    var el = document.getElementById('messageList');
    if (!list.length) { el.innerHTML = '<p>No messages yet.</p>'; return; }
    el.innerHTML = list.map(function(m){
      return '<div class="card">' +
        '<h3>' + m.name + ' <span style="font-weight:400;color:#93A2BE;">(' + m.source + ')</span></h3>' +
        '<p>' + m.message + '</p>' +
        '<div class="msg-meta">' + new Date(m.receivedAt).toLocaleString() + '</div>' +
      '</div>';
    }).join('');
  }

  if (getPassword()) { checkLogin(); }
</script>

</body>
</html>
